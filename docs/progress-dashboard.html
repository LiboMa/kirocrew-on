<title>KiroCrew ON · 进度看板</title>
<style>

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",

  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .num b { font-size: 34px; line-height: 1; display: block; }
  .ring .num span { font-size: 12px; color: #cfd3f5; }

  .count { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 12px; cursor: pointer;
           transition: background .15s; }
  .count:hover, .count.on { background: rgba(255,255,255,.18); }
  .count b { font-size: 22px; display: block; }
  .count i { font-style: normal; font-size: 12px; color: #dfe2ff; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }

  .panel .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .next li { margin: 0 0 12px; padding-left: 4px; }
  .next ol { margin: 0; padding-left: 20px; }
  .who { font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-right: 6px; font-weight: 600; }
  .who.owner { background: var(--blocked-soft); color: var(--blocked); }
  .who.me { background: var(--deployed-soft); color: var(--deployed); }

  .copy { float: right; margin-left: 8px; border: 0; background: #2a2163; color: #fff; border-radius: 6px; font-size: 11px; padding: 1px 7px; cursor: pointer; }

  .module .desc { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }

  .bar span { height: 100%; transition: width .9s cubic-bezier(.2,.8,.2,1); width: 0; }
  .items { border-top: 1px solid var(--line); }
  .item { padding: 9px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px; cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #fafbfe; }
  .item .name { font-weight: 600; font-size: 13px; }
  .item .ref { color: var(--muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item .more { grid-column: 1 / -1; color: var(--muted); font-size: 12px; display: none; padding-top: 4px; }
  .item.open .more { display: block; }
  .item .deps { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; height: fit-content; font-weight: 600; }
  .module.collapsed .items { display: none; }
  .hidden { display: none !important; }
  #graph { width: 100%; overflow-x: auto; }
  #graph svg { display: block; }
  .node rect { rx: 10; ry: 10; stroke-width: 1.5; transition: opacity .15s; }
  .node text { font-size: 12px; pointer-events: none; }
  .edge { fill: none; stroke: #c3c9d6; stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
  .dim { opacity: .18; }
  .hot { stroke: var(--brand) !important; stroke-width: 2.2 !important; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .log li { margin-bottom: 6px; font-size: 12.5px; }
  .log b { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--brand); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 40px; }
  @media (max-width: 920px) { .hero { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } .counts { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

const NEXT = [
  { who: "owner", text: "登录 owner 边界的 kiro（解锁 P4 验收、owner 上的 kiro 任务与模型列表）",
    cmd: "! cd /tmp/kc-deploy.d47 && bash deploy/aws/deploy.sh kiro-login --boundary owner" },
  { who: "me", text: "EC2 空闲后部署 0eca0b9（D51、续接模型修复、提示修正），核对 owner 的 claude 模型列表自动出现" },
  { who: "me", text: "用 admin Token 跑验收：route、p5（续接 + 用量）、steer、d50；kiro 登录后跑 p4 与 forget",
    cmd: "ACCEPT_WORKER=<personal 的 worker id> ~/.kc-work/accept_d49_p4_p5.py https://d1atltv3sl7jdu.cloudfront.net <阶段>" },
  { who: "owner", text: "看验收结果，确认推送 60 个提交到 feat/m1-runtime-foundation（我先对最终提交再扫一次）" },
];

// ---------- computation ----------
const all = MODULES.flatMap((m) => m.items.map((i) => ({ ...i, module: m })));
const byId = Object.fromEntries(all.map((i) => [i.id, i]));
const score = (items) => items.length ? items.reduce((s, i) => s + STATUS[i.status].weight, 0) / items.length : 0;
const round = all.filter((i) => i.module.scope === "round");
const mvp = all.filter((i) => i.module.scope === "mvp");

function ring(el, value, label, sub) {
  const r = 64, c = 2 * Math.PI * r;
  el.innerHTML = `<svg width="150" height="150"><circle cx="75" cy="75" r="${r}" stroke="rgba(255,255,255,.15)" stroke-width="12" fill="none"/>
    <circle cx="75" cy="75" r="${r}" stroke="url(#g-${el.id})" stroke-width="12" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
    <defs><linearGradient id="g-${el.id}" x1="0" x2="1"><stop offset="0" stop-color="#7ce0b4"/><stop offset="1" stop-color="#9f94ff"/></linearGradient></defs></svg>
    <div class="num"><div><b>0%</b><span>${label}</span><br><span style="font-size:11px">${sub}</span></div></div>`;
  const arc = el.querySelectorAll("circle")[1], num = el.querySelector("b");
  requestAnimationFrame(() => { arc.style.strokeDashoffset = c * (1 - value); });
  const t0 = performance.now();
  (function tick(t) {
    const k = Math.min(1, (t - t0) / 1200);
    num.textContent = Math.round(value * 100 * (1 - Math.pow(1 - k, 3))) + "%";
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

document.getElementById("meta").textContent =
  `更新于 ${UPDATED} · 分支 feat/m11-gates @ ${HEAD.sha}（领先远端 ${HEAD.ahead} 个提交）· EC2 运行 ${HEAD.deployed} · 回归 ${HEAD.tests} 全部通过`;
ring(document.getElementById("ring-round"), score(round), "本轮完成度", "D46–D51 + 发布");
// development (code written, deployed or not) apart from acceptance on EC2, for the features of this round
const features = round.filter((i) => i.module.id !== "release");
const built = features.filter((i) => ["accepted", "deployed", "local"].includes(i.status)).length;
const accepted = features.filter((i) => i.status === "accepted").length;
const deployedOrBetter = features.filter((i) => ["accepted", "deployed"].includes(i.status)).length;
document.getElementById("split").innerHTML =
  `本轮功能 <b>${features.length}</b> 项：开发完成 <b>${built}</b>（${Math.round(built / features.length * 100)}%）· 已上 EC2 <b>${deployedOrBetter}</b>` +
  ` · EC2 验收通过 <b>${accepted}</b>（${Math.round(accepted / features.length * 100)}%）——差距主要在验收，卡点见「下一步」。`;
ring(document.getElementById("ring-mvp"), score(mvp), "MVP 完成度", "M1–M5");

let active = null, query = "";
const counts = document.getElementById("counts");
Object.entries(STATUS).forEach(([key, s]) => {
  const n = all.filter((i) => i.status === key && i.module.scope !== "later").length;
  const div = document.createElement("div");
  div.className = "count"; div.dataset.status = key;
  div.innerHTML = `<b>${n}</b><i><span class="dot" style="background:${css(key)}"></span>${s.label}</i>`;
  div.onclick = () => { active = active === key ? null : key; render(); };
  counts.appendChild(div);
});

const filters = document.getElementById("filters");
[["全部", null], ...Object.entries(STATUS).map(([k, s]) => [s.label, k])].forEach(([label, key]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label; b.dataset.status = key ?? "";
  b.onclick = () => { active = key; render(); };
  filters.appendChild(b);
});
document.getElementById("q").oninput = (e) => { query = e.target.value.trim().toLowerCase(); render(); };
let collapsed = false;
document.getElementById("toggle-all").onclick = (e) => {
  collapsed = !collapsed; e.target.textContent = collapsed ? "全部展开" : "全部收起";
  document.querySelectorAll(".module").forEach((m) => m.classList.toggle("collapsed", collapsed));
};

function badge(status) {
  return `<span class="badge" style="color:${css(status)};background:${css(status + "-soft")}">${STATUS[status].label}</span>`;
}
function matches(i) {
  const text = [i.name, i.ref, i.more, i.id, i.module.title].join(" ").toLowerCase();
  return (!active || i.status === active) && (!query || text.includes(query));
}

const modulesEl = document.getElementById("modules");
MODULES.forEach((m) => {
  const card = document.createElement("article");
  card.className = "module"; card.dataset.module = m.id;
  const parts = Object.keys(STATUS).map((k) => [k, m.items.filter((i) => i.status === k).length]);
  card.innerHTML = `<header><h3>${m.title}<small>${Math.round(score(m.items) * 100)}% · ${m.items.length} 项</small></h3>
      <p class="desc">${m.desc}</p>
      <div class="bar">${parts.map(([k, n]) => `<span data-w="${n / m.items.length * 100}" style="background:${css(k)}"></span>`).join("")}</div></header>
    <div class="items">${m.items.map((i) => `<div class="item" data-id="${i.id}">
        <div><div class="name">${i.name}</div><div class="ref">${i.ref ?? ""}</div>
          ${i.deps ? `<div class="deps">依赖：${i.deps.map((d) => byId[d]?.name ?? d).join("；")}</div>` : ""}</div>
        ${badge(i.status)}${i.more ? `<div class="more">${i.more}</div>` : ""}</div>`).join("")}</div>`;
  card.querySelector("header").onclick = () => card.classList.toggle("collapsed");
  card.querySelectorAll(".item").forEach((el) => el.onclick = () => el.classList.toggle("open"));
  modulesEl.appendChild(card);
});
requestAnimationFrame(() => document.querySelectorAll(".bar span").forEach((s) => s.style.width = s.dataset.w + "%"));

function render() {
  document.querySelectorAll(".count").forEach((c) => c.classList.toggle("on", c.dataset.status === active));
  document.querySelectorAll("#filters .chip").forEach((c) => c.classList.toggle("on", (c.dataset.status || null) === active));
  document.querySelectorAll(".item").forEach((el) => el.classList.toggle("hidden", !matches(byId[el.dataset.id])));
  document.querySelectorAll(".module").forEach((card) =>
    card.classList.toggle("hidden", !card.querySelector(".item:not(.hidden)")));
}
render();

// ---------- next steps and bugs ----------
document.getElementById("next").innerHTML = NEXT.map((n) => `<li><span class="who ${n.who}">${n.who === "owner" ? "需要你" : "平台推进"}</span>${n.text}
  ${n.cmd ? `<code class="cmd"><button class="copy" data-cmd="${n.cmd.replace(/"/g, "&quot;")}">复制</button>${n.cmd}</code>` : ""}</li>`).join("");
document.querySelectorAll(".copy").forEach((b) => b.onclick = async () => {
  try { await navigator.clipboard.writeText(b.dataset.cmd); b.textContent = "已复制"; } catch { b.textContent = "请手动复制"; }
  setTimeout(() => b.textContent = "复制", 1500);
});
document.getElementById("bugs").innerHTML = BUGS.map(([sha, text]) => `<li><b>${sha}</b> ${text}</li>`).join("");
document.getElementById("legend").innerHTML = Object.entries(STATUS).map(([k, s]) =>
  `<span><span class="dot" style="background:${css(k)}"></span>${s.label}</span>`).join("");

// ---------- dependency graph: the release path ----------
const GRAPH = ["kiro-owner", "creds", "deploy-next", "p4", "p5a", "d51-disc", "d50-pack", "retest-9507",
               "acc-route", "acc-p5", "acc-steer", "acc-d50", "acc-d51", "acc-p4", "scan", "confirm", "push", "team-kb"];
const extra = { p4: ["acc-p4"], p5a: ["acc-p5"], "d51-disc": ["acc-d51"], "d50-pack": ["acc-d50"], "retest-9507": ["acc-p5"] };
const edges = [];
GRAPH.forEach((id) => (byId[id].deps ?? []).forEach((d) => GRAPH.includes(d) && edges.push([d, id])));
Object.entries(extra).forEach(([from, tos]) => tos.forEach((to) => edges.push([from, to])));
const depth = {};
const level = (id, seen = new Set()) => {
  if (id in depth) return depth[id];
  if (seen.has(id)) return 0;   // a cycle in the data: draw it rather than hang
  seen.add(id);
  return depth[id] = Math.max(0, ...edges.filter(([, to]) => to === id).map(([from]) => level(from, seen) + 1));
};
GRAPH.forEach((id) => level(id));
const cols = {};
GRAPH.forEach((id) => (cols[depth[id]] ??= []).push(id));
const W = 168, H = 38, GX = 54, GY = 14;
const pos = {};
Object.entries(cols).forEach(([c, ids]) => ids.forEach((id, r) => pos[id] = { x: 10 + c * (W + GX), y: 10 + r * (H + GY) }));
const width = 20 + (Object.keys(cols).length) * (W + GX), height = 20 + Math.max(...Object.values(cols).map((l) => l.length)) * (H + GY);
const label = (id) => { const n = byId[id].name; return n.length > 13 ? n.slice(0, 13) + "…" : n; };
let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
edges.forEach(([a, b], k) => {
  const p = pos[a], q = pos[b];
  const x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x, y2 = q.y + H / 2, mx = (x1 + x2) / 2;
  svg += `<path class="edge" data-a="${a}" data-b="${b}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
});
GRAPH.forEach((id) => {
  const { x, y } = pos[id], s = byId[id].status;
  svg += `<g class="node" data-id="${id}" transform="translate(${x},${y})"><title>${byId[id].name} · ${STATUS[s].label}</title>
    <rect width="${W}" height="${H}" fill="${css(s + "-soft")}" stroke="${css(s)}"></rect>
    <circle cx="14" cy="${H / 2}" r="4" fill="${css(s)}"></circle>
    <text x="26" y="${H / 2 + 4}" fill="${css("ink")}">${label(id)}</text></g>`;
});
svg += "</svg>";
const graph = document.getElementById("graph");
graph.innerHTML = svg;
const reach = (id, dir) => {
  const seen = new Set([id]), stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    edges.forEach(([a, b]) => {
      const next = dir === "up" ? (b === cur ? a : null) : (a === cur ? b : null);
      if (next && !seen.has(next)) { seen.add(next); stack.push(next); }
    });
  }
  return seen;
};
graph.querySelectorAll(".node").forEach((n) => {
  n.onmouseenter = () => {
    const id = n.dataset.id, keep = new Set([...reach(id, "up"), ...reach(id, "down")]);
    graph.querySelectorAll(".node").forEach((o) => o.classList.toggle("dim", !keep.has(o.dataset.id)));
    graph.querySelectorAll(".edge").forEach((e) => {
      const on = keep.has(e.dataset.a) && keep.has(e.dataset.b);
      e.classList.toggle("dim", !on); e.classList.toggle("hot", on);
    });
  };
  n.onmouseleave = () => graph.querySelectorAll(".dim, .hot").forEach((e) => e.classList.remove("dim", "hot"));
  n.onclick = () => {
    const el = document.querySelector(`.item[data-id="${n.dataset.id}"]`);
    if (!el) return;
    el.closest(".module").classList.remove("collapsed");
    el.classList.add("open"); el.scrollIntoView({ behavior: "smooth", block: "center" });
  };
});
</script>
</body>
