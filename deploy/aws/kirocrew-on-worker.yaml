AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  KiroCrew ON Worker host (D28): a dedicated execution environment for Teams. KiroCrew, the coding tools and one boundary
  run here; only the platform host reaches the Worker, over TLS signed by the platform's private CA. Its native chat has
  its own CloudFront distribution whose origin is the platform host, which relays it over the same TLS. Admin via SSM.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  PlatformSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The platform host's security group; the only source admitted to the Worker port
  ImageId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
  VolumeSizeGiB:
    Type: Number
    MinValue: 30
  ArtifactBucket:
    Type: String
    Description: The platform stack's artifact bucket (releases are installed from it)
  WorkerPort:
    Type: Number
    Default: 8943
  GatewayTlsPort:
    Type: Number
    Default: 8944
    Description: Worker host nginx port (TLS, private CA) in front of the loopback native KiroCrew Gateway
  PreviewTlsPort:
    Type: Number
    Default: 8945
    Description: Worker host nginx port (TLS, private CA) for the remote preview; forwards only to loopback ports 47000-47999
  RelayPort:
    Type: Number
    MinValue: 1024
    MaxValue: 65535
    Description: >-
      Platform host nginx port that relays this host's native chat (deploy.sh allocates one per Worker host, between the
      platform's NativePort + 1 and NativeRelayEnd)
  PlatformOriginDomain:
    Type: String
    Description: The platform host's public DNS name (platform stack output HostOriginDomain)
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: The platform's X-Origin-Verify secret; the relay only forwards requests that carry it
  BackupTag:
    Type: String
    Description: The platform stack name; its daily snapshot policy selects volumes by this Backup tag

Resources:
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: KiroCrew ON Worker host - TLS Worker port only from the platform host; admin via SSM
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref WorkerPort
          ToPort: !Ref WorkerPort
          SourceSecurityGroupId: !Ref PlatformSecurityGroupId
          Description: Platform to Worker (TLS, private CA, Bearer Worker token)
        - IpProtocol: tcp
          FromPort: !Ref GatewayTlsPort
          ToPort: !Ref GatewayTlsPort
          SourceSecurityGroupId: !Ref PlatformSecurityGroupId
          Description: Platform relay to the native KiroCrew Gateway (TLS, private CA; Gateway token login)
        - IpProtocol: tcp
          FromPort: !Ref PreviewTlsPort
          ToPort: !Ref PreviewTlsPort
          SourceSecurityGroupId: !Ref PlatformSecurityGroupId
          Description: Platform preview proxy to the apps (TLS, private CA; check header from the Worker token)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound for SSM, Bedrock, package sources and git
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}"}]

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: kirocrew-on-worker-host
          PolicyDocument:
            Version: "2012-10-17"
            # No platform secret: every process on this host, the agents included, can use this role.
            Statement:
              - Sid: BedrockForCodingTools
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetFoundationModel
                  - bedrock:ListFoundationModels
                Resource: "*"
              - Sid: BedrockMantleForCodex
                Effect: Allow
                Action: [bedrock-mantle:CreateInference]
                Resource: !Sub "arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*"
              - Sid: ReadReleases
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/releases/*"

  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  WorkerHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref WorkerProfile
      SecurityGroupIds: [!Ref WorkerSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      PropagateTagsToVolumeOnCreation: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: false
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Minimal bootstrap; deploy.sh worker-host push installs the Worker host through SSM Run Command.
          dnf install -y git tar gzip jq unzip
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}"}
        - {Key: Project, Value: kirocrew-on}
        - {Key: Backup, Value: !Ref BackupTag}

  # Browser -> CloudFront (origin secret) -> platform host nginx :RelayPort -> private network, TLS -> this host's nginx
  # :GatewayTlsPort -> loopback Gateway. The Worker host itself stays unreachable from the internet.
  NativeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "KiroCrew ON native chat (${AWS::StackName})"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: kirocrew-native-relay
            DomainName: !Ref PlatformOriginDomain
            CustomOriginConfig:
              HTTPPort: !Ref RelayPort
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: kirocrew-native-relay
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
          Compress: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags: [{Key: Project, Value: kirocrew-on}]

Outputs:
  InstanceId:
    Value: !Ref WorkerHost
  PrivateIp:
    Value: !GetAtt WorkerHost.PrivateIp
  NativeDomain:
    Value: !GetAtt NativeDistribution.DomainName
