          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
          Compress: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags: [{Key: Project, Value: kirocrew-on}]

  # Remote preview (D36 §5.2): the apps on an origin of their own, so no console cookie or storage is ever theirs.
  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "KiroCrew ON remote preview (${AWS::StackName})"
