AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  KiroCrew ON single-node edition (MVP 0.2.0 P2, design §4.2.3 step 13): CloudFront in front of a host the user started
  and installed with install.sh. An Elastic IP for a stable origin, one ingress rule on the host's own security group
  admitting only CloudFront's origin-facing prefix list, the console, native and preview distributions with the origin
  secret injected, and daily DLM snapshots of the host (tag Backup=<stack>). Nothing here grants the host role anything:
  after the install the role keeps Bedrock (and SSM) only (S29).

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: 这台单机版主机（install.sh 从实例元数据取）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 主机的安全组；本栈只在其中加一条 CloudFront 入站规则，删栈时一并移除
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: "pl-[0-9a-f]+"
    Description: com.amazonaws.global.cloudfront.origin-facing 托管前缀列表 ID（install.sh 查询）
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: CloudFront 注入的 X-Origin-Verify 头；在主机上生成，只写本机 0640 文件（/etc/kirocrew-on/origin-secret）
  ApiPort:
    Type: Number
    Default: 8918
  NativePort:
    Type: Number
    Default: 8919
    Description: 主机 nginx 端口：原生对话入口，校验源站密钥后转发到回环上的 Gateway
  NativeRelayEnd:
    Type: Number
    Default: 8929
    Description: 入站规则的上限端口；8920 起是其他边界的原生中转端口（kirocrew-on single native）
  PreviewPort:
    Type: Number
    Default: 8929
    Description: 主机 nginx 端口：远程预览，校验源站密钥后经 auth_request 转发到会话应用

  NativeRelay1:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8920 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay2:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8921 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay3:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8922 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay4:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8923 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay5:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8924 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay6:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8925 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay7:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8926 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay8:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8927 的边界（kirocrew-on single native <边界> 填写；空：不用）
  NativeRelay9:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z][a-z0-9-]{1,19}$"
    Description: 用中转端口 8928 的边界（kirocrew-on single native <边界> 填写；空：不用）

Conditions:
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]
  HasNativeRelay1: !Not [!Equals [!Ref NativeRelay1, ""]]
  HasNativeRelay2: !Not [!Equals [!Ref NativeRelay2, ""]]
  HasNativeRelay3: !Not [!Equals [!Ref NativeRelay3, ""]]
  HasNativeRelay4: !Not [!Equals [!Ref NativeRelay4, ""]]
  HasNativeRelay5: !Not [!Equals [!Ref NativeRelay5, ""]]
  HasNativeRelay6: !Not [!Equals [!Ref NativeRelay6, ""]]
  HasNativeRelay7: !Not [!Equals [!Ref NativeRelay7, ""]]
  HasNativeRelay8: !Not [!Equals [!Ref NativeRelay8, ""]]
  HasNativeRelay9: !Not [!Equals [!Ref NativeRelay9, ""]]

Resources:
  OriginIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref ApiPort
      ToPort: !Ref NativeRelayEnd
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: KiroCrew ON - CloudFront origin fetches to the console, native chat, relays and previews

  HostAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref InstanceId
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-origin"}]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "KiroCrew ON console and API (${AWS::StackName})"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: kirocrew-on-origin
            # The Elastic IP's public DNS name: stays when the instance stops and starts.
            DomainName: !If
              - IsUsEast1
              - !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref HostAddress]], ".compute-1.amazonaws.com"]]
              - !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref HostAddress]], !Sub ".${AWS::Region}.compute.amazonaws.com"]]
            CustomOriginConfig:
              HTTPPort: !Ref ApiPort
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: kirocrew-on-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
          Compress: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags: [{Key: Project, Value: kirocrew-on}]

  NativeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "KiroCrew ON native chat (${AWS::StackName})"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: kirocrew-native-origin
            DomainName: !If
              - IsUsEast1
              - !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref HostAddress]], ".compute-1.amazonaws.com"]]
              - !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref HostAddress]], !Sub ".${AWS::Region}.compute.amazonaws.com"]]
            CustomOriginConfig:
              HTTPPort: !Ref NativePort
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: kirocrew-native-origin
          ViewerProtocolPolicy: redirect-to-https
