# Included in every server that relays the native KiroCrew chat to the public (kirocrew-native.conf, kirocrew-relay.conf,
# kirocrew-boundary.conf); al2023.sh installs it as /etc/nginx/kirocrew-native-guard.conf. K03 (2026-10-26, EC2): besides
# the access cookie of the native entry (crew_entry_ttl, 1 h), the Gateway mints a 30-day refresh chain (mc_refresh_<port>,
# Path=/api/auth) that /api/auth/refresh rotates into new sessions — a login the platform can neither shorten nor end.
# Through the public entry the login ends with its access cookie: the refresh answers as a revoked chain does, so the page
# stops retrying and the person opens the entry again from the console.
location = /api/auth/refresh {
    default_type application/json;
    return 401 '{"error":"refresh_chain_revoked"}';
}
