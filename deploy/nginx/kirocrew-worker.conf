# Worker host (D28): TLS with a certificate signed by the platform's private CA, forwarded to the loopback Worker.
# The security group only admits the platform host; the Worker still checks its Bearer token on every request.
server {
    listen __WORKER_TLS_PORT__ ssl;
    ssl_certificate /etc/kirocrew-on/worker-tls.crt;
    ssl_certificate_key /etc/kirocrew-on/worker-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:__WORKER_PORT__;
        proxy_set_header Host 127.0.0.1:__WORKER_PORT__;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
