# Worker host (D28): TLS with a certificate signed by the platform's private CA, forwarded to the loopback Worker and
# Gateway. The security group only admits the platform host; the Worker still checks its Bearer token on every request,
# the Gateway its own token login, Host and CSRF checks (the public origin is crew_url, composition/environment.py).
# The native entry link carries a one-time ?token=: log the path only ($uri), never the query string.
log_format kirocrew_worker '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $kirocrew_worker_upgrade {
    default upgrade;
    "" close;
}

server {
    listen __WORKER_TLS_PORT__ ssl;
    ssl_certificate /etc/kirocrew-on/worker-tls.crt;
    ssl_certificate_key /etc/kirocrew-on/worker-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/kirocrew-worker.access.log kirocrew_worker;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:__WORKER_PORT__;
        proxy_set_header Host 127.0.0.1:__WORKER_PORT__;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# Native KiroCrew chat, relayed by the platform host from this host's CloudFront distribution (kirocrew-relay.conf).
server {
    listen __GATEWAY_TLS_PORT__ ssl;
    ssl_certificate /etc/kirocrew-on/worker-tls.crt;
    ssl_certificate_key /etc/kirocrew-on/worker-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/kirocrew-gateway.access.log kirocrew_worker;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kirocrew_worker_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
