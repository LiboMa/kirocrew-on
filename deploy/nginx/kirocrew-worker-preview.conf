# Remote preview on a Worker host (D36 §5.2): the platform host's preview nginx (kirocrew-preview.conf) reaches this
# host's apps here, over private TLS with the check header derived from this boundary's Worker token (al2023.sh
# render_worker_preview fills in the placeholders; mode 0640 root:nginx). Only loopback ports 47000–47999 can be
# reached, and the security group admits only the platform host.
log_format kirocrew_app '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_x_preview_port $kirocrew_app_port {
    "~^47[0-9]{3}$" $http_x_preview_port;
    default "";
}

map $http_upgrade $kirocrew_app_upgrade {
    default upgrade;
    "" close;
}

server {
    listen __PREVIEW_TLS_PORT__ ssl;
    ssl_certificate /etc/kirocrew-on/worker-tls.crt;
    ssl_certificate_key /etc/kirocrew-on/worker-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/kirocrew-preview.access.log kirocrew_app;
    client_max_body_size 50m;

    if ($http_x_preview_verify != "__PREVIEW_VERIFY__") {
        return 403;
    }
    if ($kirocrew_app_port = "") {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:$kirocrew_app_port;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:$kirocrew_app_port;
        proxy_set_header X-Preview-Verify "";
        proxy_set_header X-Preview-Port "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kirocrew_app_upgrade;
        proxy_redirect off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
