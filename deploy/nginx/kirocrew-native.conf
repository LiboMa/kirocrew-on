# Native KiroCrew chat behind its own CloudFront distribution (al2023.sh renders the __PLACEHOLDERS__).
# CloudFront → security group (origin-facing prefix list) → this server → loopback Gateway. Only requests that carry
# the CloudFront origin secret are forwarded; the Gateway keeps its own token login, Host and CSRF checks, and trusts
# the public origin through KIROCREW_CORS_ORIGINS (composition/environment.py). Mode 0640 root:nginx (secret inside).
map $http_x_origin_verify $kirocrew_native_origin_ok {
    default 0;
    "__ORIGIN_SECRET__" 1;
}

# The entry link carries a one-time ?token=: log the path only ($uri), never the query string.
log_format kirocrew_native '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen __NATIVE_PORT__ default_server;
    listen [::]:__NATIVE_PORT__ default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/kirocrew-native.access.log kirocrew_native;
    client_max_body_size 50m;

    if ($kirocrew_native_origin_ok = 0) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Origin-Verify "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
