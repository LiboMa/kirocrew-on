# Native KiroCrew chat of one person's boundary on the platform host (D49 phase 3; deploy.sh boundary native renders the
# __PLACEHOLDERS__ into /etc/nginx/conf.d/kirocrew-relay-boundary-<name>.conf, mode 0640 root:nginx: the secret is inside).
# The boundary's CloudFront distribution → this server (origin secret, same rule as kirocrew-native.conf) → its loopback
# Gateway. Uses log_format kirocrew_native and $connection_upgrade from kirocrew-native.conf (path only, never the ?token=).
server {
    listen __RELAY_PORT__;
    listen [::]:__RELAY_PORT__;
    server_name _;
    server_tokens off;
    # Root-only directory: upstream errors log the request line, ?token= included.
    access_log /var/log/nginx/kirocrew-relay/boundary-__BOUNDARY__.access.log kirocrew_native;
    error_log /var/log/nginx/kirocrew-relay/boundary-__BOUNDARY__.error.log;
    client_max_body_size 50m;

    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Origin-Verify "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
