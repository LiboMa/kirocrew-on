# Native KiroCrew chat of a Worker host (D28), relayed by the platform host (deploy.sh worker-host native renders the
# __PLACEHOLDERS__ into /etc/nginx/conf.d/kirocrew-relay-<name>.conf, mode 0640 root:nginx: the secret is inside).
# The Worker host's CloudFront distribution → this server (origin secret, same rule as kirocrew-native.conf) → private
# network, TLS that trusts only the platform's private CA → the Worker host's nginx → its loopback Gateway.
# Uses log_format kirocrew_native and $connection_upgrade from kirocrew-native.conf (path only, never the ?token=).
server {
    listen __RELAY_PORT__;
    listen [::]:__RELAY_PORT__;
    server_name _;
    server_tokens off;
    # Root-only directory (deploy.sh worker-host native): upstream errors log the request line, ?token= included.
    access_log /var/log/nginx/kirocrew-relay/__WORKER_NAME__.access.log kirocrew_native;
    error_log /var/log/nginx/kirocrew-relay/__WORKER_NAME__.error.log;
    client_max_body_size 50m;

    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    location / {
        proxy_pass https://__WORKER_IP__:__GATEWAY_TLS_PORT__;
        # nginx checks host names only, not IP addresses: the certificate also names the host under worker.kirocrew-on.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/kirocrew-on/worker-ca.pem;
        proxy_ssl_name __WORKER_NAME__.worker.kirocrew-on;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Origin-Verify "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
