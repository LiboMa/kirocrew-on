# Remote preview (D36 §5.2) behind its own CloudFront distribution (al2023.sh render_preview fills in the placeholders;
# mode 0640 root:nginx, the origin secret inside). Every request is first checked by the API (auth_request to
# /v1/preview-auth: the preview cookie's holder may still read the Session and its app runs), then sent where the API
# says: this host's loopback, or a Worker host's preview port over private TLS (the private CA, the name in its
# certificate) with the check header that host's nginx requires. Opening links carry a ticket: log the path only.
log_format kirocrew_preview '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $kirocrew_preview_upgrade {
    default upgrade;
    "" close;
}

server {
    listen __PREVIEW_PORT__;
    listen [::]:__PREVIEW_PORT__;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/kirocrew-preview.access.log kirocrew_preview;
    client_max_body_size 50m;

    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    # Opening links (/_kirocrew/open, /_kirocrew/enter) and the page shown when a preview may not be seen: the API.
    location ^~ /_kirocrew/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_set_header Host 127.0.0.1:__API_PORT__;
        proxy_set_header X-Origin-Verify "";
        proxy_set_header X-Preview-Gate "__PREVIEW_GATE__";
    }

    location = /_kirocrew_auth {
        internal;
        proxy_pass http://127.0.0.1:__API_PORT__/v1/preview-auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:__API_PORT__;
        proxy_set_header X-Origin-Verify "";
        proxy_set_header X-Preview-Gate "__PREVIEW_GATE__";
    }

    location @kirocrew_denied {
        rewrite ^ /_kirocrew/denied break;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:__API_PORT__;
        proxy_set_header X-Origin-Verify "";
        proxy_set_header X-Preview-Gate "__PREVIEW_GATE__";
    }

    location / {
        # All Sessions' apps share this origin: no app may install a service worker, which would outlive its
        # preview and read the next one opened in this browser (the opening page clears what else they leave).
        if ($http_service_worker) {
            return 403;
        }
        auth_request /_kirocrew_auth;
        auth_request_set $kc_upstream $upstream_http_x_preview_upstream;
        auth_request_set $kc_port $upstream_http_x_preview_port;
        auth_request_set $kc_name $upstream_http_x_preview_name;
        auth_request_set $kc_verify $upstream_http_x_preview_verify;
        error_page 401 403 = @kirocrew_denied;

        proxy_pass $kc_upstream;
        # Worker hosts only (https upstreams): the platform's private CA and the name in the host's certificate.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/kirocrew-on/worker-ca.pem;
        proxy_ssl_name $kc_name;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        # Development servers check Host (Vite, webpack): they see their own localhost address.
        proxy_set_header Host localhost:$kc_port;
        proxy_set_header X-Preview-Port $kc_port;
        proxy_set_header X-Preview-Verify $kc_verify;
        proxy_set_header X-Preview-Name "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kirocrew_preview_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Origin-Verify "";
        proxy_set_header X-Preview-Gate "";
        # Nothing of one Session's app is served from the browser's cache to another (revalidation still works), and
        # no app steers nginx into its internal locations.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache" always;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
        # An app redirecting to its own localhost address stays on the preview domain.
        proxy_redirect ~^https?://(localhost|127\.0\.0\.1):[0-9]+/?(.*)$ /$2;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
